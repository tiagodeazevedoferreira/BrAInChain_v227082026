[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brainchain-crypto-discovery"
version = "0.1.0"
description = "Phase 1 discovery engine for BrAInChain Autonomous Crypto Trading"
requires-python = ">=3.11"
dependencies = ["requests>=2.31,<3"]

[project.optional-dependencies]
firebase = ["firebase-admin>=6.5,<8"]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["discovery*"]
