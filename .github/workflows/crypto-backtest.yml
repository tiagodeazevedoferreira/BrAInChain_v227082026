name: Crypto Backtesting Engine

on:
  workflow_dispatch:
  push:
    paths:
      - 'crypto_backtest/**'
      - '.github/workflows/crypto-backtest.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crypto_backtest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest -q
