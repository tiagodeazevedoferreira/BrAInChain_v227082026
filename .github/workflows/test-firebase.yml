name: Test GitHub - Firebase Realtime Database

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firebase-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Firebase Admin SDK
        run: python -m pip install --disable-pip-version-check firebase-admin

      - name: Create temporary Firebase credential file
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT" || {
            echo "ERROR: GitHub Secret FIREBASE_SERVICE_ACCOUNT is not configured."
            exit 1
          }
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"

      - name: Write and read Firebase test record
        env:
          FIREBASE_SERVICE_ACCOUNT_FILE: ${{ runner.temp }}/firebase-service-account.json
          FIREBASE_DATABASE_URL: https://brainchainv227082026-default-rtdb.firebaseio.com
        run: |
          python - <<'PY'
          import json
          import os
          import uuid
          from datetime import datetime, timezone

          import firebase_admin
          from firebase_admin import credentials, db

          credential_file = os.environ["FIREBASE_SERVICE_ACCOUNT_FILE"]
          database_url = os.environ["FIREBASE_DATABASE_URL"]

          with open(credential_file, "r", encoding="utf-8") as fh:
              credential_data = json.load(fh)

          required = {"project_id", "client_email", "private_key"}
          missing = sorted(required - credential_data.keys())
          if missing:
              raise RuntimeError(f"Firebase service account is missing fields: {missing}")

          app = firebase_admin.initialize_app(
              credentials.Certificate(credential_file),
              {"databaseURL": database_url},
          )

          test_id = uuid.uuid4().hex
          path = f"system/github_firebase_tests/{test_id}"
          payload = {
              "status": "github_write_test",
              "source": "github-actions",
              "repository": os.environ.get("GITHUB_REPOSITORY", "unknown"),
              "workflow": os.environ.get("GITHUB_WORKFLOW", "unknown"),
              "run_id": os.environ.get("GITHUB_RUN_ID", "unknown"),
              "timestamp_utc": datetime.now(timezone.utc).isoformat(),
          }

          ref = db.reference(path, app=app)
          ref.set(payload)
          result = ref.get()

          if result != payload:
              raise RuntimeError(
                  "Firebase verification failed: data read from Firebase does not match data written."
              )

          print("FIREBASE_CONNECTION=OK")
          print("FIREBASE_WRITE=OK")
          print("FIREBASE_READ=OK")
          print(f"FIREBASE_TEST_PATH={path}")
          print("Firebase GitHub Actions integration test passed.")
          PY

      - name: Remove temporary credential
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/firebase-service-account.json"
