name: Crypto Security Intelligence

on:
  workflow_dispatch:
  push:
    paths:
      - "crypto_security/**"
      - ".github/workflows/crypto-security.yml"
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read

concurrency:
  group: crypto-security
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: crypto_security
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install security package
        run: python -m pip install -e '.[test]'
      - name: Run security tests
        run: python -m pytest -q

  security-scan:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: crypto_security
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -e '.[firebase]'
      - name: Create temporary Firebase credential file
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || {
            echo "ERROR: FIREBASE_SERVICE_ACCOUNT_JSON is not configured."
            exit 1
          }
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"
      - name: Run incremental security analysis
        env:
          FIREBASE_SERVICE_ACCOUNT_FILE: ${{ runner.temp }}/firebase-service-account.json
          FIREBASE_DATABASE_URL: https://brainchainv227082026-default-rtdb.firebaseio.com
          SECURITY_MAX_TOKENS: "25"
        run: python -m security.firebase_runner
      - name: Remove temporary credential
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
