name: Crypto Discovery

on:
  push:
    paths:
      - "crypto_discovery/**"
      - ".github/workflows/crypto-discovery.yml"
  workflow_dispatch:
    inputs:
      pages:
        description: "GeckoTerminal new-pool pages to scan"
        required: false
        default: "10"
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read

concurrency:
  group: crypto-discovery
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: crypto_discovery/pyproject.toml

      - name: Install package and test dependencies
        working-directory: crypto_discovery
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Unit tests
        working-directory: crypto_discovery
        run: python -m pytest -q

      - name: Live discovery smoke test
        working-directory: crypto_discovery
        env:
          DISCOVERY_PAGES: ${{ inputs.pages || '10' }}
        run: python -m discovery.main --pages "$DISCOVERY_PAGES"

  persist:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and Firebase dependency
        working-directory: crypto_discovery
        run: python -m pip install -e ".[firebase]"

      - name: Create temporary Firebase credential
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || {
            echo "ERROR: FIREBASE_SERVICE_ACCOUNT_JSON secret is not configured."
            exit 1
          }
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"

      - name: Discover and persist
        working-directory: crypto_discovery
        env:
          FIREBASE_SERVICE_ACCOUNT_FILE: ${{ runner.temp }}/firebase-service-account.json
          FIREBASE_DATABASE_URL: https://brainchainv227082026-default-rtdb.firebaseio.com
          DISCOVERY_PAGES: ${{ inputs.pages || '10' }}
        run: python -m discovery.main --pages "$DISCOVERY_PAGES" --firebase

      - name: Verify Firebase persistence by reading the committed run state
        working-directory: crypto_discovery
        env:
          FIREBASE_SERVICE_ACCOUNT_FILE: ${{ runner.temp }}/firebase-service-account.json
          FIREBASE_DATABASE_URL: https://brainchainv227082026-default-rtdb.firebaseio.com
        run: |
          python - <<'PY'
          import os
          import firebase_admin
          from firebase_admin import credentials, db

          app = firebase_admin.initialize_app(
              credentials.Certificate(os.environ["FIREBASE_SERVICE_ACCOUNT_FILE"]),
              {"databaseURL": os.environ["FIREBASE_DATABASE_URL"]},
          )
          status = db.reference("discovery/status", app=app).get()
          if not status or not status.get("last_run_at"):
              raise SystemExit("Firebase verification failed: discovery/status was not written.")
          if int(status.get("pool_count", 0)) <= 0:
              raise SystemExit("Firebase verification failed: pool_count is zero.")
          print("FIREBASE_DISCOVERY_WRITE=OK")
          print("FIREBASE_DISCOVERY_READ=OK")
          print(f"DISCOVERED_POOL_COUNT={status['pool_count']}")
          PY

      - name: Remove temporary Firebase credential
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
