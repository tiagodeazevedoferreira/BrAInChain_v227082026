name: Crypto Continuous Learning

on:
  workflow_dispatch:
  push:
    paths:
      - 'crypto_learning/**'
      - '.github/workflows/crypto-learning.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crypto_learning
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest -q

  governance:
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: crypto_learning
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - name: Verify failed candidate cannot promote
        run: |
          python - <<'PY'
          from learning.governance import evaluate_candidate, promote
          from learning.schemas import EvaluationResult
          champion = EvaluationResult('champion', 1000, .8, .7, .7, 5, 10, True, ())
          candidate = EvaluationResult('candidate', 10, .9, .8, .9, 20, 5, False, ('insufficient_samples',))
          candidate = evaluate_candidate(candidate)
          assert not candidate.approved
          assert not promote(champion, candidate)
          print('MODEL_PROMOTION_GATE=OK')
          PY
