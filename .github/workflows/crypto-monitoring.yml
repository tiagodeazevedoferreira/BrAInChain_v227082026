name: Crypto ML Monitoring & Readiness

on:
  workflow_dispatch:
  push:
    paths:
      - 'crypto_monitoring/**'
      - 'ML_MONITORING/**'
      - 'data/ml-monitoring.json'
      - '.github/workflows/crypto-monitoring.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crypto_monitoring
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest -q

  readiness-contract:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crypto_monitoring
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify fail-closed readiness
        run: |
          python - <<'PY'
          from monitoring.readiness import evaluate_readiness
          r = evaluate_readiness(
              data_quality=True, sufficient_samples=True, oos_validated=True,
              walk_forward_validated=True, paper_trading_validated=True,
              security_validated=True, failure_tests_validated=True,
              secrets_validated=True, circuit_breakers_validated=True,
              venue_validated=False, owner_approved=False)
          assert not r.ready
          print('LIVE_READINESS_FAIL_CLOSED=OK')
          PY
