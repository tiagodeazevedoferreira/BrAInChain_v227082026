name: Crypto Dataset & ML Foundation

on:
  workflow_dispatch:
  push:
    paths:
      - 'crypto_ml/**'
      - '.github/workflows/crypto-ml.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crypto_ml
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run tests
        run: python -m pytest -q

  readiness:
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: crypto_ml
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify empty dataset is blocked
        run: |
          python - <<'PY'
          from ml.readiness import check_readiness
          ready, reasons = check_readiness([])
          assert not ready
          assert reasons
          print('READINESS_GATE=OK')
          PY
