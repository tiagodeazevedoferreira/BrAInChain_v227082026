name: Crypto Market & On-chain Intelligence

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}
  push:
    paths:
      - "crypto_market/**"
      - ".github/workflows/crypto-market-intelligence.yml"
      - "crypto_discovery/**"

permissions:
  contents: write

concurrency:
  group: crypto-market-intelligence
  cancel-in-progress: false

env:
  FIREBASE_DATABASE_URL: https://brainchainv227082026-default-rtdb.firebaseio.com
  MARKET_MAX_TOKENS: "25"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crypto_market
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[test]"
      - run: pytest -q

  intelligence-scan:
    needs: test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: crypto_market
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[firebase]"

      - name: Validate Firebase secret
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || {
            echo "ERROR: GitHub Actions secret FIREBASE_SERVICE_ACCOUNT_JSON is empty or unavailable to this workflow."
            echo "Create it under repository Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          }
          python - <<'PY'
          import json, os
          raw = os.environ["FIREBASE_SERVICE_ACCOUNT_JSON"]
          data = json.loads(raw)
          required = {"type", "project_id", "private_key", "client_email"}
          missing = sorted(required - data.keys())
          if missing:
              raise SystemExit(f"ERROR: Firebase service-account JSON is missing fields: {', '.join(missing)}")
          if data.get("type") != "service_account":
              raise SystemExit("ERROR: FIREBASE_SERVICE_ACCOUNT_JSON is not a service-account credential.")
          print("Firebase service-account secret: present and structurally valid")
          PY

      - name: Write Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > firebase-service-account.json
          chmod 600 firebase-service-account.json
          test -s firebase-service-account.json

      - name: Run market intelligence
        env:
          FIREBASE_SERVICE_ACCOUNT_FILE: ${{ github.workspace }}/crypto_market/firebase-service-account.json
        run: python -m market.main --firebase

      - name: Export monitoring feed
        env:
          FIREBASE_SERVICE_ACCOUNT_FILE: ${{ github.workspace }}/crypto_market/firebase-service-account.json
        run: python -m market.monitoring_export

      - name: Publish monitoring feed
        working-directory: .
        run: |
          set -euo pipefail
          test -f data/ml-monitoring.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ml-monitoring.json
          if git diff --cached --quiet; then
            echo "Monitoring feed unchanged; nothing to publish."
          else
            git commit -m "chore: update ML monitoring feed"
            git push
          fi

      - name: Remove credentials
        if: always()
        run: rm -f firebase-service-account.json
