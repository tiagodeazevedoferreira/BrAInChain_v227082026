name: Crypto Restricted Live Safety Gate

on:
  workflow_dispatch:
  push:
    paths:
      - 'crypto_live/**'
      - '.github/workflows/crypto-live.yml'

permissions:
  contents: read

jobs:
  safety-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crypto_live
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest -q
      - name: Verify live transport is still blocked
        run: |
          python - <<'PY'
          from live.executor import LiveExecutor
          result = LiveExecutor(True).submit({'side': 'BUY'})
          assert result['status'] == 'BLOCKED'
          assert result['reason'] == 'NO_APPROVED_VENUE_ADAPTER'
          print('LIVE_TRANSPORT=BLOCKED_BY_DESIGN')
          PY
