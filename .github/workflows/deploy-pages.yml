name: Deploy ML Monitoring Dashboard

on:
  push:
    branches: [main]
    paths:
      - "ML_MONITORING/**"
      - "data/ml-monitoring.json"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate dashboard files
        run: |
          test -f ML_MONITORING/index.html
          test -f ML_MONITORING/manifest.webmanifest
          test -f ML_MONITORING/sw.js
          test -f data/ml-monitoring.json
          python - <<'PY'
          import json
          from pathlib import Path
          json.loads(Path('ML_MONITORING/manifest.webmanifest').read_text())
          json.loads(Path('data/ml-monitoring.json').read_text())
          print('DASHBOARD_STATIC_VALIDATION=OK')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare Pages artifact
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R ML_MONITORING/. _site/
          mkdir -p _site/data
          cp data/ml-monitoring.json _site/data/ml-monitoring.json
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
